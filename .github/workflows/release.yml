name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/sh_test-linux-amd64 .
          GOOS=darwin GOARCH=amd64 go build -o dist/sh_test-darwin-amd64 .
          GOOS=windows GOARCH=amd64 go build -o dist/sh_test-windows-amd64.exe .

      - name: Create release and upload assets
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}